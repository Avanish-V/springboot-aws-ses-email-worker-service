spring:
  application:
    name: email-worker-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?prepareThreshold=0}
    username: ${DB_USERNAME:postgres.vzghvbbiwiidlreqafku}
    password: ${DB_PASSWORD:BhX7rKkfAFT8AuDM}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
